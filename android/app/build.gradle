import groovy.json.JsonSlurper

// Automatically read version from project's package.json
def getPackageVersionName() {
    try {
        def inputFile = file("../../../package.json")
        def parsedJson = new JsonSlurper().parseText(inputFile.text)
        return parsedJson.version ?: "1.0"
    } catch (Exception e) {
        return "1.0"
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.sjr.timesheet'
    compileSdkVersion rootProject.ext.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.sjr.timesheet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName getPackageVersionName() // Automatically reads from package.json!
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Clean APK Naming matching the version
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "SJR Builders Timesheet"
            def versionName = variant.versionName
            outputFileName = "${appName} ${versionName}.apk"
        }
    }
}

