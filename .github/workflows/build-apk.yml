name: Build and Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Auto-Bump Version
        id: bump_version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main --rebase
          
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
          git push origin main

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Pre-download Gradle Distribution with Retries
        run: |
          cd android
          GRADLE_URL=$(grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties | cut -d'=' -f2- | tr -d '\r' | xargs)
          echo "Downloading Gradle from: $GRADLE_URL"
          curl --retry 5 --retry-delay 10 --retry-connrefused -fLo gradle-wrapper.zip "$GRADLE_URL"

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          # Run build in offline mode to block any external requests to gradle servers
          ./gradlew assembleDebug --offline

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sjr-builders-timesheet-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "android/app/build/outputs/apk/debug/*.apk"
          tag: ${{ steps.bump_version.outputs.VERSION }}
          name: "Release ${{ steps.bump_version.outputs.VERSION }}"
          body: "Automated build release for ${{ steps.bump_version.outputs.VERSION }}"
          token: ${{ secrets.GITHUB_TOKEN }}
