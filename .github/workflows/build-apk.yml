name: Build and Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 1. Automatically increment patch version in package.json (e.g., 1.0.0 -> 1.0.1)
      - name: Auto-Bump Version
        id: bump_version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Bump patch version without creating a git tag immediately
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Commit and push updated package.json back to main
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
          git push origin main

      # 2. Sync Android Gradle versionName & versionCode with the bumped npm version
      - name: Update Android Gradle Version
        run: |
          # Strip 'v' if present (e.g., v1.0.4 -> 1.0.4)
          CLEAN_VERSION=$(echo "${{ steps.bump_version.outputs.VERSION }}" | sed 's/^v//')
          
          # Calculate a unique integer versionCode using GitHub run number
          VERSION_CODE=${{ github.run_number }}
          
          # Update versionName in android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$CLEAN_VERSION\"/" android/app/build.gradle
          
          # Update versionCode in android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          
          echo "Updated android/app/build.gradle to versionName: $CLEAN_VERSION (versionCode: $VERSION_CODE)"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 3. Create GitHub Release with the auto-bumped version tag
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "android/app/build/outputs/apk/debug/app-debug.apk"
          tag: ${{ steps.bump_version.outputs.VERSION }}
          name: "Release ${{ steps.bump_version.outputs.VERSION }}"
          body: "Automated build release for ${{ steps.bump_version.outputs.VERSION }}"
          token: ${{ secrets.GITHUB_TOKEN }}
